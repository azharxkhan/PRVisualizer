<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 446" width="880" height="446" role="img" aria-labelledby="t d">
  <title id="t">The map view</title>
  <desc id="d">A summary bar of four numbers above a treemap of changed files grouped by folder and coloured by status, with a diff panel to the right showing the patch for the selected file.</desc>
  <g font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
    <rect x="0.5" y="0.5" width="879" height="445" rx="10" fill="#ffffff" stroke="#d0d7de"/>

    <rect x="24" y="22" width="200" height="60" rx="6" fill="#f6f8fa"/>
    <text x="38" y="44" font-size="11" fill="#6e7781">files changed</text>
    <text x="38" y="68" font-size="19" fill="#1f2328">24</text>
    <rect x="232" y="22" width="200" height="60" rx="6" fill="#f6f8fa"/>
    <text x="246" y="44" font-size="11" fill="#6e7781">lines added</text>
    <text x="246" y="68" font-size="19" fill="#1a7f37">+1,284</text>
    <rect x="440" y="22" width="200" height="60" rx="6" fill="#f6f8fa"/>
    <text x="454" y="44" font-size="11" fill="#6e7781">lines removed</text>
    <text x="454" y="68" font-size="19" fill="#cf222e">-337</text>
    <rect x="648" y="22" width="208" height="60" rx="6" fill="#f6f8fa"/>
    <text x="662" y="44" font-size="11" fill="#6e7781">busiest folder</text>
    <text x="662" y="68" font-size="14" fill="#1f2328">web/src/map</text>

    <rect x="24" y="100" width="516" height="300" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>

    <rect x="32" y="108" width="500" height="126" rx="5" fill="none" stroke="#d8dee4"/>
    <text x="40" y="124" font-size="11" fill="#6e7781">web/src/map</text>
    <rect x="38" y="130" width="196" height="98" rx="4" fill="#eaf3de" stroke="#97c459"/>
    <text x="48" y="150" font-size="11" fill="#2d5309">Treemap.tsx</text>
    <text x="48" y="166" font-size="11" fill="#44691f">+214</text>
    <rect x="240" y="130" width="134" height="98" rx="4" fill="#eaf3de" stroke="#97c459"/>
    <text x="250" y="150" font-size="11" fill="#2d5309">layout.ts</text>
    <text x="250" y="166" font-size="11" fill="#44691f">+138</text>
    <rect x="380" y="130" width="146" height="46" rx="4" fill="#eaf3de" stroke="#97c459"/>
    <text x="390" y="150" font-size="11" fill="#2d5309">FileBox.tsx</text>
    <text x="390" y="166" font-size="11" fill="#44691f">+96</text>
    <rect x="380" y="182" width="146" height="46" rx="4" fill="#eaf3de" stroke="#97c459"/>
    <text x="390" y="202" font-size="11" fill="#2d5309">colors.ts</text>
    <text x="390" y="218" font-size="11" fill="#44691f">+41</text>

    <rect x="32" y="242" width="500" height="78" rx="5" fill="none" stroke="#d8dee4"/>
    <text x="40" y="258" font-size="11" fill="#6e7781">web/src</text>
    <rect x="38" y="264" width="226" height="50" rx="4" fill="#faeeda" stroke="#ef9f27"/>
    <text x="48" y="284" font-size="11" fill="#6b3f08">App.tsx</text>
    <text x="48" y="300" font-size="11" fill="#854f0b">+62 -48</text>
    <rect x="270" y="264" width="140" height="50" rx="4" fill="#fcebeb" stroke="#f09595"/>
    <text x="280" y="284" font-size="11" fill="#8f2626">FileList.tsx</text>
    <text x="280" y="300" font-size="11" fill="#a32d2d">-134</text>
    <rect x="416" y="264" width="110" height="50" rx="4" fill="#f1efe8" stroke="#b4b2a9"/>
    <text x="426" y="284" font-size="11" fill="#44443f">hero.png</text>
    <text x="426" y="300" font-size="11" fill="#5f5e5a">binary</text>

    <rect x="32" y="328" width="500" height="64" rx="5" fill="none" stroke="#d8dee4"/>
    <text x="40" y="344" font-size="11" fill="#6e7781">api/PrMap.Api</text>
    <rect x="38" y="350" width="226" height="36" rx="4" fill="#faeeda" stroke="#ef9f27"/>
    <text x="48" y="373" font-size="11" fill="#6b3f08">PullRequestEndpoints.cs  +74 -19</text>
    <rect x="270" y="350" width="146" height="36" rx="4" fill="#faeeda" stroke="#ef9f27"/>
    <text x="280" y="373" font-size="11" fill="#6b3f08">GitHubFileService.cs</text>
    <rect x="422" y="350" width="104" height="36" rx="4" fill="#f1efe8" stroke="#b4b2a9"/>
    <text x="432" y="373" font-size="11" fill="#44443f">ChangedFile.cs</text>

    <rect x="556" y="100" width="300" height="300" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <text x="570" y="124" font-size="11" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" fill="#1f2328">web/src/map/layout.ts</text>
    <rect x="570" y="132" width="52" height="18" rx="4" fill="#eaf3de"/>
    <text x="578" y="145" font-size="10" fill="#2d5309">added</text>
    <text x="800" y="145" font-size="11" fill="#1a7f37">+138</text>
    <line x1="570" y1="162" x2="842" y2="162" stroke="#d8dee4"/>
    <g font-size="11" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">
      <text x="570" y="182" fill="#0969da">@@ -0,0 +1,9 @@</text>
      <rect x="566" y="190" width="280" height="17" fill="#e6ffec"/>
      <text x="570" y="203" fill="#1a7f37">+ export function squarify(</text>
      <rect x="566" y="209" width="280" height="17" fill="#e6ffec"/>
      <text x="570" y="222" fill="#1a7f37">+   node: TreeNode, rect: Rect</text>
      <rect x="566" y="228" width="280" height="17" fill="#e6ffec"/>
      <text x="570" y="241" fill="#1a7f37">+ ): Tile[] {</text>
      <rect x="566" y="247" width="280" height="17" fill="#e6ffec"/>
      <text x="570" y="260" fill="#1a7f37">+   const tiles: Tile[] = []</text>
      <rect x="566" y="266" width="280" height="17" fill="#e6ffec"/>
      <text x="570" y="279" fill="#1a7f37">+   let free = { ...rect }</text>
      <rect x="566" y="285" width="280" height="17" fill="#e6ffec"/>
      <text x="570" y="298" fill="#1a7f37">+   for (const c of node.children) {</text>
      <rect x="566" y="304" width="280" height="17" fill="#e6ffec"/>
      <text x="570" y="317" fill="#1a7f37">+     tiles.push(place(c, free))</text>
      <text x="570" y="336" fill="#57606a">    ...</text>
    </g>
    <text x="570" y="376" font-size="11" fill="#6e7781">binary files and oversized patches show</text>
    <text x="570" y="391" font-size="11" fill="#6e7781">a fallback with a link to GitHub</text>

    <g font-size="11" fill="#6e7781">
      <rect x="24" y="414" width="11" height="11" rx="2" fill="#eaf3de" stroke="#97c459"/><text x="41" y="424">added</text>
      <rect x="92" y="414" width="11" height="11" rx="2" fill="#faeeda" stroke="#ef9f27"/><text x="109" y="424">modified</text>
      <rect x="174" y="414" width="11" height="11" rx="2" fill="#fcebeb" stroke="#f09595"/><text x="191" y="424">removed</text>
      <rect x="256" y="414" width="11" height="11" rx="2" fill="#f1efe8" stroke="#b4b2a9"/><text x="273" y="424">renamed or binary</text>
      <text x="400" y="424">box area = lines changed</text>
      <text x="600" y="424">click a box to open its diff</text>
    </g>
  </g>
</svg>
