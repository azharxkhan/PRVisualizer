<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-labelledby="t d">
  <title id="t">Request flow</title>
  <desc id="d">The browser holds only a session cookie. The API applies a rate limit, validates input, checks a five minute cache, then calls GitHub with the user token, which never crosses back to the browser.</desc>
  <g font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
    <rect x="0.5" y="0.5" width="879" height="299" rx="10" fill="#ffffff" stroke="#d0d7de"/>

    <line x1="196" y1="34" x2="196" y2="268" stroke="#8c959f" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="202" y="48" font-size="11" fill="#6e7781">trust boundary</text>
    <text x="202" y="63" font-size="11" fill="#6e7781">the GitHub token never crosses back to the left</text>

    <rect x="24" y="118" width="150" height="64" rx="6" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="38" y="143" font-size="13" fill="#0a3069">Browser</text>
    <text x="38" y="161" font-size="11" fill="#1f6feb">React, Vite, SVG map</text>
    <text x="24" y="202" font-size="11" fill="#6e7781">holds: HttpOnly session cookie</text>
    <text x="24" y="217" font-size="11" fill="#6e7781">holds: nothing else</text>

    <rect x="212" y="88" width="436" height="124" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="226" y="108" font-size="12" fill="#1f2328">ASP.NET Core API (.NET 10)</text>

    <rect x="226" y="120" width="98" height="76" rx="5" fill="#ffffff" stroke="#d0d7de"/>
    <text x="238" y="146" font-size="11" fill="#1f2328">rate limit</text>
    <text x="238" y="162" font-size="11" fill="#6e7781">20 per min</text>
    <text x="238" y="178" font-size="11" fill="#6e7781">per user, 429</text>

    <rect x="334" y="120" width="98" height="76" rx="5" fill="#ffffff" stroke="#d0d7de"/>
    <text x="346" y="146" font-size="11" fill="#1f2328">validate</text>
    <text x="346" y="162" font-size="11" fill="#6e7781">owner, repo</text>
    <text x="346" y="178" font-size="11" fill="#6e7781">number, 400</text>

    <rect x="442" y="120" width="98" height="76" rx="5" fill="#ffffff" stroke="#d0d7de"/>
    <text x="454" y="146" font-size="11" fill="#1f2328">cache</text>
    <text x="454" y="162" font-size="11" fill="#6e7781">IMemoryCache</text>
    <text x="454" y="178" font-size="11" fill="#6e7781">5 minutes</text>

    <rect x="550" y="120" width="86" height="76" rx="5" fill="#ffffff" stroke="#d0d7de"/>
    <text x="562" y="146" font-size="11" fill="#1f2328">Octokit</text>
    <text x="562" y="162" font-size="11" fill="#6e7781">token from</text>
    <text x="562" y="178" font-size="11" fill="#6e7781">encrypted store</text>

    <rect x="686" y="118" width="170" height="64" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="700" y="143" font-size="13" fill="#1f2328">GitHub REST API</text>
    <text x="700" y="161" font-size="11" fill="#6e7781">list pull request files</text>
    <text x="686" y="202" font-size="11" fill="#6e7781">per_page=100, loop pages</text>
    <text x="686" y="217" font-size="11" fill="#6e7781">first 3,000 files only</text>

    <path d="M174,150 L206,150" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
    <path d="M324,158 L330,158" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
    <path d="M432,158 L438,158" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
    <path d="M540,158 L546,158" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
    <path d="M648,150 L680,150" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>

    <text x="196" y="258" font-size="11" fill="#6e7781">GET /api/prs/{owner}/{repo}/{number}/files  returns  filename, status, additions, deletions, patch</text>
  </g>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#57606a"/>
    </marker>
  </defs>
</svg>
