<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-labelledby="t d">
  <title id="t">How a call moved</title>
  <desc id="d">Two panels compare the call path before and after the pull request. Before, the FileList view fetched the files endpoint itself. After, that fetch has moved into a usePrFiles hook, so the call is rerouted rather than added and removed.</desc>
  <g font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
    <rect x="0.5" y="0.5" width="879" height="329" rx="10" fill="#ffffff" stroke="#d0d7de"/>

    <rect x="24" y="44" width="396" height="246" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="38" y="30" font-size="12" fill="#6e7781">before (base commit)</text>
    <rect x="44" y="70" width="140" height="42" rx="5" fill="#faeeda" stroke="#ef9f27"/>
    <text x="56" y="88" font-size="11" fill="#6b3f08">App.tsx</text>
    <text x="56" y="103" font-size="11" fill="#854f0b">view</text>
    <rect x="44" y="150" width="140" height="42" rx="5" fill="#fcebeb" stroke="#f09595"/>
    <text x="56" y="168" font-size="11" fill="#8f2626">FileList.tsx</text>
    <text x="56" y="183" font-size="11" fill="#a32d2d">fetched /files itself</text>
    <rect x="248" y="150" width="152" height="42" rx="5" fill="#f1efe8" stroke="#b4b2a9"/>
    <text x="260" y="168" font-size="11" fill="#44443f">GET .../files</text>
    <text x="260" y="183" font-size="11" fill="#5f5e5a">endpoint</text>
    <rect x="248" y="230" width="152" height="42" rx="5" fill="#f1efe8" stroke="#b4b2a9"/>
    <text x="260" y="248" font-size="11" fill="#44443f">GitHubFileService</text>
    <text x="260" y="263" font-size="11" fill="#5f5e5a">service</text>
    <path d="M114,112 L114,144" stroke="#e24b4a" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#r)"/>
    <path d="M184,171 L242,171" stroke="#e24b4a" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#r)"/>
    <path d="M324,192 L324,224" stroke="#888780" stroke-width="1.3" marker-end="url(#g)"/>

    <rect x="460" y="44" width="396" height="246" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="474" y="30" font-size="12" fill="#6e7781">after (head commit)</text>
    <rect x="480" y="70" width="140" height="42" rx="5" fill="#faeeda" stroke="#ef9f27"/>
    <text x="492" y="88" font-size="11" fill="#6b3f08">App.tsx</text>
    <text x="492" y="103" font-size="11" fill="#854f0b">view</text>
    <rect x="480" y="150" width="140" height="42" rx="5" fill="#eaf3de" stroke="#97c459"/>
    <text x="492" y="168" font-size="11" fill="#2d5309">usePrFiles()</text>
    <text x="492" y="183" font-size="11" fill="#44691f">hook</text>
    <rect x="684" y="150" width="152" height="42" rx="5" fill="#faeeda" stroke="#ef9f27"/>
    <text x="696" y="168" font-size="11" fill="#6b3f08">GET .../files</text>
    <text x="696" y="183" font-size="11" fill="#854f0b">endpoint</text>
    <rect x="684" y="230" width="152" height="42" rx="5" fill="#faeeda" stroke="#ef9f27"/>
    <text x="696" y="248" font-size="11" fill="#6b3f08">GitHubFileService</text>
    <text x="696" y="263" font-size="11" fill="#854f0b">service</text>
    <path d="M550,112 L550,144" stroke="#639922" stroke-width="1.8" marker-end="url(#n)"/>
    <path d="M620,171 L678,171" stroke="#639922" stroke-width="1.8" marker-end="url(#n)"/>
    <path d="M760,192 L760,224" stroke="#888780" stroke-width="1.3" marker-end="url(#g)"/>

    <text x="24" y="314" font-size="11" fill="#6e7781">same target, different caller: one rerouted call, not one deletion plus one addition. Detecting that needs the graph built at both commits.</text>
  </g>
  <defs>
    <marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#e24b4a"/></marker>
    <marker id="n" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#639922"/></marker>
    <marker id="g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#888780"/></marker>
  </defs>
</svg>
