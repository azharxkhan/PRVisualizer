name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages needs these two; the token stays read-only for everything else.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and a newer push waits rather than cancelling the one mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          # No API is deployed with the site, so the browser calls GitHub directly.
          VITE_STATIC: 'true'
          # A project site lives at /<repo>/, so built asset URLs need that prefix.
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Serve index.html for unknown paths
        # Pages has no rewrite rules; a copy of index.html as 404.html makes deep links work.
        run: cp web/dist/index.html web/dist/404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
